<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Stock Opname Scanner</title>
<style>
  :root{--bg:#f6f7f9;--card:#fff;--tx:#1b1f24;--mut:#6b7280;--pri:#0b6bcb;--ok:#168a45;--err:#c62828;--bd:#e2e5ea}
  @media(prefers-color-scheme:dark){:root{--bg:#14171b;--card:#1d2127;--tx:#eceff3;--mut:#9aa3af;--bd:#2c323a}}
  *{box-sizing:border-box}
  body{margin:0;font:16px system-ui,sans-serif;background:var(--bg);color:var(--tx);padding:12px;max-width:520px;margin-inline:auto}
  .card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:12px;margin-bottom:12px}
  label{display:block;font-size:13px;color:var(--mut);margin:8px 0 2px}
  input{width:100%;padding:10px;border:1px solid var(--bd);border-radius:8px;background:var(--bg);color:var(--tx);font-size:16px}
  button,.btn{display:block;text-align:center;padding:12px 14px;border:0;border-radius:8px;background:var(--pri);color:#fff;font-size:16px;font-weight:600}
  button.sec,.btn.sec{background:var(--bd);color:var(--tx)}
  .row{display:flex;gap:8px;align-items:center}.row>*{flex:1}
  .chk{display:flex;gap:8px;align-items:center;margin-top:8px}.chk input{width:auto}
  .vwrap{position:relative;background:#000;border-radius:8px;overflow:hidden}
  #video{width:100%;display:block;min-height:200px;object-fit:cover}
  .guide{position:absolute;inset:0;margin:auto;width:62%;aspect-ratio:1;border:3px solid rgba(255,255,255,.85);border-radius:12px;pointer-events:none;box-shadow:0 0 0 999px rgba(0,0,0,.25)}
  #status{font-size:13px;margin-top:8px;word-break:break-word}
  #confirm{display:none;border-color:var(--pri)}
  #code{font:600 20px ui-monospace,monospace;word-break:break-all}
  #log div{padding:6px 0;border-bottom:1px solid var(--bd);font-size:14px}
  .ok{color:var(--ok)}.err{color:var(--err)}.mut{color:var(--mut)}
  details summary{font-weight:600}
</style>
</head>
<body>

<details class="card" id="settings">
  <summary>Pengaturan</summary>
  <label>URL Web App (Apps Script /exec)</label><input id="url" inputmode="url">
  <label>Token</label><input id="token" type="password">
  <label>Nama petugas</label><input id="petugas">
  <label>Lokasi / rak</label><input id="lokasi" placeholder="mis. A-01-03">
  <div class="row" style="margin-top:10px"><button onclick="saveCfg()">Simpan</button></div>
</details>

<div class="card">
  <div class="vwrap"><video id="video" playsinline muted autoplay></video><div class="guide"></div></div>
  <canvas id="cv" hidden></canvas>
  <div id="status" class="mut">Tekan Mulai scan, lalu arahkan QR ke dalam kotak. Tidak perlu menekan shutter.</div>
  <div class="row" style="margin-top:10px">
    <button onclick="start()">Mulai scan</button>
    <button class="sec" onclick="stop()">Stop</button>
    <button class="sec" id="btnTorch" onclick="toggleTorch()" style="flex:0 0 auto">🔦</button>
  </div>
  <label class="chk"><input type="checkbox" id="auto"> Mode cepat: tiap scan langsung +1 (tanpa konfirmasi)</label>
  <label class="chk"><input type="checkbox" id="hires"> Tajamkan otomatis (ambil foto resolusi tinggi di latar)</label>
</div>

<div class="card" id="confirm">
  <div class="mut">QR terbaca</div>
  <div id="code"></div>
  <label>Qty</label><input id="qty" type="number" inputmode="numeric" min="1" value="1">
  <div class="row" style="margin-top:10px">
    <button onclick="confirmSave()">Simpan</button>
    <button class="sec" onclick="cancelScan()">Batal</button>
  </div>
</div>

<details class="card">
  <summary>Cadangan: foto manual / ketik manual</summary>
  <label class="btn sec" style="margin-top:10px;color:var(--tx)">📷 Foto QR
    <input type="file" id="photo" accept="image/*" capture="environment" hidden>
  </label>
  <label>Input manual</label>
  <div class="row"><input id="manual" placeholder="ketik isi QR / kode"><button onclick="manualAdd()" style="flex:0 0 auto">Tambah</button></div>
</details>

<div class="card">
  <div class="row"><strong>Riwayat</strong><span id="qinfo" class="mut" style="text-align:right"></span></div>
  <div id="log"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js"></script>
<script>
const $ = id => document.getElementById(id);
const cfg = JSON.parse(localStorage.getItem('cfg') || '{}');
let queue = JSON.parse(localStorage.getItem('queue') || '[]');
let stream = null, running = false, paused = false, flushing = false;
let last = '', lastT = 0, pendingCode = null;
let ic = null, lastShot = 0, tick = 0, torchOn = false, info = '';
let detector = null;
if ('BarcodeDetector' in window) { try { detector = new BarcodeDetector({ formats: ['qr_code'] }); } catch (e) {} }

['url','token','petugas','lokasi'].forEach(k => $(k).value = cfg[k] || '');
if (!cfg.url) $('settings').open = true;
function saveCfg() {
  ['url','token','petugas','lokasi'].forEach(k => cfg[k] = $(k).value.trim());
  localStorage.setItem('cfg', JSON.stringify(cfg));
  $('settings').open = false;
}
$('lokasi').addEventListener('change', () => { cfg.lokasi = $('lokasi').value.trim(); localStorage.setItem('cfg', JSON.stringify(cfg)); });

function setStatus(msg, cls) { const s = $('status'); s.textContent = msg; s.className = cls || 'mut'; }
function log(msg, cls) {
  const d = document.createElement('div');
  d.className = cls || ''; d.textContent = msg;
  $('log').prepend(d);
  while ($('log').children.length > 30) $('log').lastChild.remove();
}
function saveQueue() {
  localStorage.setItem('queue', JSON.stringify(queue));
  $('qinfo').textContent = queue.length ? queue.length + ' menunggu kirim' : 'semua terkirim';
}

/* ---------- kirim ke Google Sheets ---------- */
async function send(item) {
  const r = await fetch(cfg.url, {
    method: 'POST',
    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
    body: JSON.stringify({ ...item, token: cfg.token })
  });
  const j = await r.json();
  if (!j.ok) throw Object.assign(new Error(j.error), { server: true });
  return j;
}
async function flush() {
  if (flushing) return;
  flushing = true;
  while (queue.length) {
    const item = queue[0];
    try {
      const j = await send(item);
      queue.shift(); saveQueue();
      log('✓ ' + item.barcode + ' ×' + item.qty + (j.nama ? ' — ' + j.nama : ''), 'ok');
    } catch (e) {
      log(e.server ? '✗ Server: ' + e.message : '… offline, ' + queue.length + ' antre', 'err');
      break;
    }
  }
  flushing = false;
}
function submit(barcode, qty) {
  if (!cfg.url) { $('settings').open = true; alert('Isi URL Web App dulu'); return; }
  queue.push({ ts: new Date().toISOString(), petugas: cfg.petugas, lokasi: $('lokasi').value.trim(), barcode, qty });
  saveQueue(); flush();
}

/* ---------- decoder QR ---------- */
const cv = $('cv');
function jsqrRegion(src, sx, sy, sw, sh, maxW) {
  const sc = Math.min(1, maxW / sw), w = Math.round(sw * sc), h = Math.round(sh * sc);
  cv.width = w; cv.height = h;
  const ctx = cv.getContext('2d', { willReadFrequently: true });
  ctx.drawImage(src, sx, sy, sw, sh, 0, 0, w, h);
  const r = jsQR(ctx.getImageData(0, 0, w, h).data, w, h, { inversionAttempts: 'attemptBoth' });
  return r ? r.data : null;
}
function dims(src) { return [src.videoWidth || src.width, src.videoHeight || src.height]; }

// frame live: detektor native di seluruh frame, lalu jsQR di area tengah pada resolusi asli
async function decodeFrame(v) {
  if (detector) {
    try { const r = await detector.detect(v); if (r.length) return r[0].rawValue; } catch (e) {}
  }
  const [W, H] = dims(v);
  if (!W || !H) return null;
  const s = Math.floor(Math.min(W, H) * 0.7);
  let t = jsqrRegion(v, Math.floor((W - s) / 2), Math.floor((H - s) / 2), s, s, 900);
  if (!t && tick % 3 === 0) t = jsqrRegion(v, 0, 0, W, H, 1280);
  return t;
}
// foto resolusi tinggi: coba beberapa ukuran
async function decodePhoto(bmp) {
  if (detector) {
    try { const r = await detector.detect(bmp); if (r.length) return r[0].rawValue; } catch (e) {}
  }
  const [W, H] = dims(bmp);
  return jsqrRegion(bmp, 0, 0, W, H, 1280) || jsqrRegion(bmp, 0, 0, W, H, 2000) || jsqrRegion(bmp, 0, 0, W, H, 3200);
}

/* ---------- kamera ---------- */
async function start() {
  if (running) return;
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
    return setStatus('Browser tidak mendukung kamera, atau halaman bukan HTTPS', 'err');
  }
  try {
    stream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: { ideal: 'environment' }, width: { ideal: 1920 }, height: { ideal: 1080 } },
      audio: false
    });
  } catch (e) {
    return setStatus('Kamera gagal dibuka: ' + e.name + ' — ' + e.message, 'err');
  }
  const v = $('video');
  v.srcObject = stream;
  try { await v.play(); } catch (e) {}
  const track = stream.getVideoTracks()[0];
  let caps = {};
  try {
    caps = track.getCapabilities ? track.getCapabilities() : {};
    if (caps.focusMode && caps.focusMode.includes('continuous')) {
      await track.applyConstraints({ advanced: [{ focusMode: 'continuous' }] });
    }
  } catch (e) {}
  $('btnTorch').style.display = caps.torch ? '' : 'none';
  ic = ('ImageCapture' in window) ? new ImageCapture(track) : null;
  const s = track.getSettings();
  info = (s.width || '?') + '×' + (s.height || '?') + ' · ' + (detector ? 'BarcodeDetector+jsQR' : 'jsQR');
  running = true; paused = false; tick = 0;
  loop();
}
function stop() {
  running = false; torchOn = false;
  if (stream) stream.getTracks().forEach(t => t.stop());
  stream = null; $('video').srcObject = null;
  setStatus('Kamera dihentikan');
}
async function toggleTorch() {
  const t = stream && stream.getVideoTracks()[0];
  if (!t) return;
  torchOn = !torchOn;
  try { await t.applyConstraints({ advanced: [{ torch: torchOn }] }); }
  catch (e) { torchOn = false; setStatus('Senter tidak didukung di HP ini', 'err'); }
}
async function loop() {
  if (!running) return;
  const v = $('video');
  if (!paused && v.readyState >= 2) {
    tick++;
    try {
      let txt = await decodeFrame(v);
      // opsional: ambil foto resolusi tinggi (autofokus penuh) tiap ~1,5 dtk
      if (!txt && ic && $('hires').checked && Date.now() - lastShot > 1500) {
        lastShot = Date.now();
        try {
          const blob = await ic.takePhoto({ fillLightMode: 'off' });
          const bmp = await createImageBitmap(blob);
          txt = await decodePhoto(bmp);
          if (bmp.close) bmp.close();
        } catch (e) {}
      }
      if (txt) onScan(txt);
    } catch (e) {}
    if (tick % 8 === 0 && !paused) setStatus('Memindai… ' + info + ' · frame ' + tick);
  }
  setTimeout(loop, 80);
}

/* ---------- hasil scan ---------- */
function onScan(text) {
  const now = Date.now();
  // QR yang sama masih di depan kamera -> abaikan (harus menjauh >1,5 dtk baru dihitung lagi)
  if (text === last && now - lastT < 1500) { lastT = now; return; }
  last = text; lastT = now;
  if (navigator.vibrate) navigator.vibrate(80);
  setStatus('Terbaca: ' + text, 'ok');
  if ($('auto').checked) return submit(text, 1);
  paused = true; pendingCode = text;
  $('code').textContent = text; $('qty').value = 1;
  $('confirm').style.display = 'block';
  $('qty').focus(); $('qty').select();
}
function confirmSave() {
  submit(pendingCode, Math.max(1, parseInt($('qty').value) || 1));
  cancelScan();
}
function cancelScan() {
  $('confirm').style.display = 'none';
  last = pendingCode || last; lastT = Date.now(); pendingCode = null; paused = false;
}
function manualAdd() {
  const v = $('manual').value.trim();
  if (v) { submit(v, 1); $('manual').value = ''; }
}

/* ---------- cadangan: foto lewat kamera bawaan ---------- */
$('photo').addEventListener('change', async e => {
  const f = e.target.files[0]; e.target.value = '';
  if (!f) return;
  setStatus('Membaca foto…');
  try {
    const bmp = await createImageBitmap(f);
    const txt = await decodePhoto(bmp);
    if (txt) onScan(txt);
    else setStatus('QR tidak ditemukan di foto. Ambil lebih dekat dan tajam.', 'err');
  } catch (err) { setStatus('Gagal membaca foto: ' + err.message, 'err'); }
});

window.addEventListener('online', flush);
saveQueue(); flush();
</script>
</body>
</html>
